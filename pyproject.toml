[project]
name = "lawcite"
version = "0.2.0"
description = "Tools for working with Danish laws in LaTeX"
authors = [{ name = "evid 210122431+evidlabel@users.noreply.github.com" }]
requires-python = "~=3.12.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "bibtexparser>=1.4.1,<2",
    "requests>=2.31.0,<3",
    "pypdf>=5.8.0,<6",
    "unidecode>=1.3.8,<2",
    "pyyaml>=6.0.1,<7",
    "treeparse>=0.3.4",
    "pydantic>=2.0.0,<3",
]

[project.scripts]
lawcite = "lawcite.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=4.1.0,<5",
    "ruff>=0.15.0,<0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=4.1.0,<5",
    "ruff>=0.15.0,<0.16",
]

[tool.hatch.build.targets.sdist]
include = ["src/lawcite"]

[tool.hatch.build.targets.wheel]
include = ["src/lawcite"]

[tool.hatch.build.targets.wheel.sources]
"src/lawcite" = "lawcite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE", "NPY", "RUF"]
# Danish source text legitimately contains en dashes / non-ASCII look-alikes,
# so the "ambiguous unicode character" rules would only create noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=lawcite --cov-report=term-missing --cov-fail-under=95"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
